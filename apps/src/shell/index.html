<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MockTerm</title>
  <link rel="stylesheet" href="../common/theme.css" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <header id="topbar">
    <div id="brand">MOCKTERM</div>
    <div id="cmdwrap">
      <span id="prompt">&gt;</span>
      <input id="cmd" data-testid="command-line" autocomplete="off" spellcheck="false"
             placeholder="Enter command, e.g. AAPL US Equity DES, WEI, TOP, IB, EURUSD Curncy GP" />
      <ul id="suggest" data-testid="suggestions" hidden></ul>
    </div>
    <div id="conn" class="connecting" data-testid="connection-status" title="mockterm &rarr; mtcomm &rarr; mtserver">CONNECTING</div>
    <div id="clock" class="muted"></div>
  </header>
  <div id="msg" data-testid="command-status"></div>
  <nav id="tabs" data-testid="tabs"></nav>
  <main id="panels"></main>
  <footer id="ticker-strip" data-testid="ticker-strip"></footer>
  <script src="main.js"></script>
</body>
</html>
